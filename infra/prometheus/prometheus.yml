# Enable exporters with: docker compose --profile monitoring up -d
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    project: smart-agriculture-irrigation
rule_files:
  - /etc/prometheus/rules/*.yml
scrape_configs:
  - job_name: application-api
    static_configs:
      - targets: [api:8000]
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: clickhouse
    static_configs:
      - targets: [clickhouse:8001]
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: [minio:9000]
  - job_name: minio-node
    metrics_path: /minio/v2/metrics/node
    static_configs:
      - targets: [minio:9000]
  - job_name: kafka
    static_configs:
      - targets: [kafka-exporter:9308]
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
  - job_name: blackbox-exporter
    static_configs:
      - targets: [blackbox-exporter:9115]
  # Endpoint availability does not prove that a streaming job is progressing.
  - job_name: service-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: [http://spark-master:8090]
        labels:
          service: spark-master
      - targets: [http://spark-worker:8091]
        labels:
          service: spark-worker
      - targets: [http://airflow-webserver:8080/health]
        labels:
          service: airflow-webserver
      - targets: [http://api:8000/health]
        labels:
          service: api
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
  - job_name: service-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: [kafka:9092]
        labels:
          service: kafka
      - targets: [postgres:5432]
        labels:
          service: postgres
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
