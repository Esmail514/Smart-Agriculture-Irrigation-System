# ============================================================
# Prometheus Configuration
# Smart Agriculture Irrigation System
# ============================================================
# Scrapes metrics from all platform services.
# Retention: 30 days (configurable via CLI flag)
# ============================================================

global:
  scrape_interval:     15s   # How often to scrape targets
  evaluation_interval: 15s   # How often to evaluate rules
  scrape_timeout:      10s
  external_labels:
    environment: "smart-agri-dev"
    project: "smart-agriculture-irrigation"

# --- Alertmanager (optional - configure if you add alertmanager) ---
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# --- Alert Rules ---
rule_files:
  - "/etc/prometheus/rules/*.yml"

# ============================================================
# SCRAPE CONFIGURATIONS
# ============================================================
scrape_configs:

  # --- Prometheus Self-Monitoring ---
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
    metrics_path: /metrics

  # ============================================================
  # KAFKA - JMX Exporter
  # Note: For production Kafka metrics, deploy a JMX exporter
  # sidecar. Here we scrape Kafka's built-in metrics endpoint.
  # ============================================================
  - job_name: "kafka"
    static_configs:
      - targets: ["kafka:9999"]
    metrics_path: /metrics
    # Kafka broker health indicator via HTTP check
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "(.+):.*"
        replacement: "$1"

  # ============================================================
  # CLICKHOUSE - Built-in Prometheus endpoint
  # Configured via clickhouse/config/prometheus.xml
  # ============================================================
  - job_name: "clickhouse"
    static_configs:
      - targets: ["clickhouse:8001"]
    metrics_path: /metrics
    honor_labels: true

  # ============================================================
  # AIRFLOW - Built-in StatsD / metrics endpoint
  # ============================================================
  - job_name: "airflow"
    static_configs:
      - targets: ["airflow-webserver:8080"]
    metrics_path: /metrics
    honor_labels: true

  # ============================================================
  # MINIO - Built-in Prometheus metrics
  # Endpoint: /minio/v2/metrics/cluster
  # ============================================================
  - job_name: "minio"
    metrics_path: /minio/v2/metrics/cluster
    scheme: http
    static_configs:
      - targets: ["minio:9000"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "(.+):.*"
        replacement: "$1"

  - job_name: "minio-node"
    metrics_path: /minio/v2/metrics/node
    scheme: http
    static_configs:
      - targets: ["minio:9000"]

  # ============================================================
  # POSTGRESQL - via postgres_exporter (if deployed)
  # ============================================================
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres:5432"]
    metrics_path: /metrics
    # Note: Requires postgres_exporter sidecar for full metrics.
    # Add postgres_exporter service to docker-compose for richer metrics.

  # ============================================================
  # SPARK - REST API metrics
  # Spark Master exposes metrics at /metrics/json
  # ============================================================
  - job_name: "spark-master"
    static_configs:
      - targets: ["spark-master:8090"]
    metrics_path: /metrics/json
    relabel_configs:
      - source_labels: [__address__]
        target_label: role
        replacement: "master"

  - job_name: "spark-worker"
    static_configs:
      - targets: ["spark-worker:8091"]
    metrics_path: /metrics/json
    relabel_configs:
      - source_labels: [__address__]
        target_label: role
        replacement: "worker"

  # ============================================================
  # DOCKER ENGINE - via cadvisor (optional)
  # Uncomment if you add cadvisor service
  # ============================================================
  # - job_name: "cadvisor"
  #   static_configs:
  #     - targets: ["cadvisor:8080"]
  #   metrics_path: /metrics
