# ============================================================
# Spark Metrics -> Prometheus (Smart Agriculture)
# Uses Spark's built-in PrometheusServlet so no extra
# sidecar/exporter container is required on this 16GB host.
# ============================================================

*.sink.servlet.class org.apache.spark.metrics.sink.PrometheusServlet
*.sink.servlet.path /metrics/prometheus

master.source.jvm.class org.apache.spark.metrics.source.JvmSource
worker.source.jvm.class org.apache.spark.metrics.source.JvmSource
driver.source.jvm.class org.apache.spark.metrics.source.JvmSource
