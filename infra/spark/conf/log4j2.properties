# ============================================================
# Log4j2 Configuration for Spark
# Smart Agriculture Irrigation System
# ============================================================
# Reduces noisy INFO logs from AWS/Hadoop/Parquet while
# keeping important Spark & application logs visible.
# ============================================================

rootLogger.level = INFO
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p %c{1} - %m%n

# --- Silence noisy AWS / Hadoop logs ---
logger.amazonaws.name = com.amazonaws
logger.amazonaws.level = WARN

logger.hadoop_aws.name = org.apache.hadoop.fs.s3a
logger.hadoop_aws.level = WARN

logger.jetty.name = org.eclipse.jetty
logger.jetty.level = WARN

logger.parquet.name = org.apache.parquet
logger.parquet.level = WARN

logger.hive.name = org.apache.hadoop.hive
logger.hive.level = WARN

# --- Keep Spark Streaming visible ---
logger.spark_streaming.name = org.apache.spark.streaming
logger.spark_streaming.level = INFO

# --- Iceberg logs ---
logger.iceberg.name = org.apache.iceberg
logger.iceberg.level = INFO
