# ============================================================
# Spark Configuration - spark-defaults.conf
# Smart Agriculture Irrigation System
# ============================================================
# This config is mounted into all Spark containers (master,
# worker, history server, and Jupyter).
# ============================================================

# --- Spark Application Defaults ---
spark.app.name                                  SmartAgriIrrigation
spark.sql.adaptive.enabled                      true
spark.sql.adaptive.coalescePartitions.enabled   true
spark.sql.shuffle.partitions                    32

# --- Driver & Executor Memory ---
# Right-sized for a 16GB single-host stack. Executor heap 512m lets THREE
# concurrent executors fit inside the worker's 2g limit (bronze/silver/gold
# + the ClickHouse sync stream rotate through them); observed per-executor
# working set for this workload is well under 300MB.
spark.driver.memory                             768m
spark.executor.memory                           512m
# 1 core per executor so four apps can run concurrently on the
# standalone worker (SPARK_WORKER_CORES=4); default would grab all cores.
spark.executor.cores                            1
spark.driver.maxResultSize                      512m

# --- S3A / MinIO Connector (Hadoop-AWS) ---
spark.hadoop.fs.s3a.impl                        org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint                    http://minio:9000
spark.hadoop.fs.s3a.path.style.access           true
spark.hadoop.fs.s3a.connection.ssl.enabled      false
spark.hadoop.fs.s3a.fast.upload                 true
spark.hadoop.fs.s3a.fast.upload.buffer          bytebuffer
spark.hadoop.fs.s3a.multipart.size              134217728
spark.hadoop.fs.s3a.connection.maximum          100
spark.hadoop.fs.s3a.committer.name              magic
spark.hadoop.mapreduce.fileoutputcommitter.algorithm.version 2

# --- Parquet Optimizations ---
spark.sql.parquet.filterPushdown                true
spark.sql.parquet.mergeSchema                   false
spark.hadoop.parquet.enable.summary-metadata    false
spark.sql.parquet.compression.codec             snappy

# --- Apache Iceberg Configuration ---
# NOTE: Uncomment these lines only after adding Iceberg JARs to spark/jars/
# (e.g. iceberg-spark-runtime-3.5_2.12-x.y.z.jar)
# spark.sql.extensions                          org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
# spark.sql.catalog.lakehouse                   org.apache.iceberg.spark.SparkCatalog
# spark.sql.catalog.lakehouse.type              hadoop
# spark.sql.catalog.lakehouse.warehouse         s3a://warehouse/
# spark.sql.catalog.lakehouse.io-impl           org.apache.iceberg.aws.s3.S3FileIO
# spark.sql.catalog.lakehouse.s3.endpoint       http://minio:9000
# spark.sql.catalog.lakehouse.s3.path-style-access true

# --- Event Logging (Spark History Server) ---
spark.eventLog.enabled                          true
spark.eventLog.dir                              /tmp/spark-events
spark.history.fs.logDirectory                   /tmp/spark-events
spark.history.retainedApplications              100

# --- Extra JARs (Kafka connector, etc.) ---
# JARs placed in ./spark/jars/ on the host are mounted at /opt/spark/extra-jars
# This makes them available to both the driver and all executors without --packages
spark.driver.extraClassPath                     /opt/spark/extra-jars/*
spark.executor.extraClassPath                   /opt/spark/extra-jars/*

# --- Streaming ---
spark.streaming.backpressure.enabled            true
spark.streaming.kafka.consumer.cache.enabled    true

# --- Serialization ---
spark.serializer                                org.apache.spark.serializer.KryoSerializer
spark.kryoserializer.buffer.max                 512m

# --- Dynamic Allocation ---
spark.dynamicAllocation.enabled                 false

# --- Network ---
spark.network.timeout                           120s
spark.executor.heartbeatInterval                20s
