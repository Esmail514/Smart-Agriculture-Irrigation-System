apiVersion: 1

# ============================================================
# Grafana Datasources Provisioning
# Smart Agriculture Irrigation System
# ============================================================
# All datasources are provisioned automatically on startup.
# No manual configuration needed.
# ============================================================

datasources:

  # --- Primary: Prometheus (default) ---
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      httpMethod: GET

  # --- ClickHouse (Gold Layer Analytics) ---
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    uid: clickhouse
    access: proxy
    editable: false
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      username: agri_analytics
      defaultDatabase: agri_gold
      tlsSkipVerify: true
    secureJsonData:
      password: "${CLICKHOUSE_PASSWORD}"

  # --- PostgreSQL (Crop / Field Reference Data) ---
  # Realigned to the actual project DB (created by ${POSTGRES_DB} in
  # docker-compose).  Previously it pointed at a database/user that do not exist.
  - name: PostgreSQL
    type: postgres
    uid: postgres
    access: proxy
    url: postgres:5432
    user: ${POSTGRES_USER}
    editable: false
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1400
      timescaledb: false
    secureJsonData:
      password: "${POSTGRES_PASSWORD}"
