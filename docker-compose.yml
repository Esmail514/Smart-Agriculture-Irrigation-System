# ============================================================
# Smart Agriculture Irrigation System
# Enterprise Docker Compose - Lakehouse Architecture
# ============================================================
# Architecture:
#   IoT Sensors → Kafka → Spark Streaming → MinIO (Bronze)
#                              ↓
#                     Spark Batch ETL → MinIO (Silver)
#                              ↓
#               Spark Business Logic → MinIO (Gold)
#                              ↓
#                         ClickHouse → Power BI
#
# Additional Sources: Weather API, PostgreSQL (Crop Data)
# Monitoring: Prometheus + Grafana
# Orchestration: Apache Airflow (CeleryExecutor + Redis)
# ============================================================

# ============================================================
# NETWORKS
# ============================================================
networks:
  # Primary data plane network - all services communicate here
  agri-net:
    name: agri-net
    driver: bridge

  # Isolated monitoring network
  monitoring-net:
    name: agri-monitoring-net
    driver: bridge

# ============================================================
# NAMED VOLUMES - Persistent Storage
# ============================================================
volumes:
  # --- Infrastructure ---
  postgres_data:
    name: agri_postgres_data
  # NOTE: agri_redis_data removed together with the Redis service
  # (Airflow migrated from CeleryExecutor to LocalExecutor).
  kafka_data:
    name: agri_kafka_data

  # --- Data Lake ---
  minio_data:
    name: agri_minio_data

  # --- Spark ---
  spark_master_data:
    name: agri_spark_master_data
  spark_worker_data:
    name: agri_spark_worker_data
  spark_history_data:
    name: agri_spark_history_data
  spark_jars_cache:
    name: agri_spark_jars_cache

  # --- ClickHouse ---
  clickhouse_data:
    name: agri_clickhouse_data
  clickhouse_logs:
    name: agri_clickhouse_logs

  # --- Airflow ---
  airflow_logs:
    name: agri_airflow_logs

  # --- Monitoring ---
  prometheus_data:
    name: agri_prometheus_data
  grafana_data:
    name: agri_grafana_data

# ============================================================
# COMMON CONFIGURATIONS (YAML Anchors)
# ============================================================
x-common-logging: &common-logging
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "3"

x-restart-policy: &restart-policy
  restart: unless-stopped

x-airflow-common-env:
  # Database backend
  &airflow-common-env
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${INTERNAL_POSTGRES_PORT}/${POSTGRES_AIRFLOW_DB}
  # NOTE: Celery broker/result-backend settings removed - LocalExecutor
  # executes tasks in-process (subprocesses of the scheduler), no broker.
  # Core settings
  AIRFLOW__CORE__EXECUTOR: ${AIRFLOW_EXECUTOR}
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC
  # Webserver
  AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
  AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
  AIRFLOW__WEBSERVER__WORKERS: 2
  # Scheduler
  AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 60
  # Connections for project services
  AIRFLOW_CONN_POSTGRES_DEFAULT: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${INTERNAL_POSTGRES_PORT}/${POSTGRES_DB}
  AIRFLOW_CONN_KAFKA_DEFAULT: kafka://kafka:9092
  AIRFLOW_CONN_MINIO_DEFAULT: s3://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
  # Variables - MinIO / S3
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT}
  # Timezone
  TZ: ${TZ}

x-airflow-common-volumes: &airflow-common-volumes
  - ./orchestration/airflow/dags:/opt/airflow/dags:rw
  - ./orchestration/airflow/plugins:/opt/airflow/plugins:rw
  - ./orchestration/airflow/config:/opt/airflow/config:ro
  - airflow_logs:/opt/airflow/logs
  - /var/run/docker.sock:/var/run/docker.sock

x-airflow-common-depends: &airflow-common-depends
  postgres:
    condition: service_healthy

x-spark-common-env:
  # S3A / MinIO configuration
  &spark-common-env
  SPARK_HADOOP_FS_S3A_ENDPOINT: ${MINIO_ENDPOINT}
  SPARK_HADOOP_FS_S3A_ACCESS_KEY: ${MINIO_ROOT_USER}
  SPARK_HADOOP_FS_S3A_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  SPARK_HADOOP_FS_S3A_PATH_STYLE_ACCESS: "true"
  SPARK_HADOOP_FS_S3A_IMPL: org.apache.hadoop.fs.s3a.S3AFileSystem
  SPARK_HADOOP_FS_S3A_CONNECTION_SSL_ENABLED: "false"
  # MinIO / Lakehouse (for code that reads MINIO_* / LAKEHOUSE_BUCKET env vars)
  MINIO_ENDPOINT: ${MINIO_ENDPOINT}
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-agri-lakehouse}
  # PostgreSQL (for Spark JDBC reads of irrigation_rules)
  POSTGRES_HOST: ${POSTGRES_HOST}
  POSTGRES_PORT: ${INTERNAL_POSTGRES_PORT}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  # Kafka (for streaming sources)
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_TOPIC_SENSORS: ${KAFKA_TOPIC_SENSORS}
  KAFKA_TOPIC_WEATHER: ${KAFKA_TOPIC_WEATHER}
  KAFKA_TOPIC_ALERTS: ${KAFKA_TOPIC_ALERTS}
  KAFKA_TOPIC_COMMANDS: ${KAFKA_TOPIC_COMMANDS}
  STREAM_TRIGGER_INTERVAL: ${STREAM_TRIGGER_INTERVAL}
  OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
  # ClickHouse JDBC (for Spark → ClickHouse writes)
  CLICKHOUSE_HOST: ${CLICKHOUSE_HOST}
  CLICKHOUSE_HTTP_PORT: ${CLICKHOUSE_HTTP_PORT}
  CLICKHOUSE_USER: ${CLICKHOUSE_USER}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  CLICKHOUSE_DB: ${CLICKHOUSE_DB}
  TZ: ${TZ}

# ============================================================
# SERVICES
# ============================================================
services:

  # ===========================================================
  # LAYER 1: INFRASTRUCTURE
  # PostgreSQL - Airflow Metadata + Crop/Field Reference Data
  # ===========================================================
  postgres:
    image: postgres:14-alpine
    container_name: agri-postgres
    hostname: postgres
    <<: [ *restart-policy, *common-logging ]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
      PGPORT: 5432
      TZ: ${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - agri-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p 5432" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m

  # ===========================================================
  # Redis - REMOVED.
  # Was only used as the Celery broker for Airflow's CeleryExecutor.
  # Airflow now uses LocalExecutor (tasks run as subprocesses of the
  # scheduler), so the broker and the dedicated worker container are gone.
  # ===========================================================

  # ===========================================================
  # LAYER 2: STREAMING INGESTION
  # Apache Kafka 3.7.1 - KRaft Mode (No ZooKeeper)
  # ===========================================================
  kafka:
    image: apache/kafka:3.7.1
    container_name: agri-kafka
    hostname: kafka
    user: root
    <<: [ *restart-policy, *common-logging ]
    environment:
      # --- KRaft Configuration ---
      KAFKA_NODE_ID: ${KAFKA_NODE_ID}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "${KAFKA_NODE_ID}@kafka:${KAFKA_CONTROLLER_PORT}"
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}

      # --- Listeners ---
      # INTERNAL: for services inside Docker network
      # CONTROLLER: for KRaft metadata replication
      # EXTERNAL: for host machine access
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # --- Storage ---
      KAFKA_LOG_DIRS: /opt/kafka/data/logs

      # --- JVM Heap (explicit) ---
      # Image default is -Xmx1G/-Xms1G which EQUALS the 1g cgroup limit,
      # leaving no room for metaspace/threads -> GC thrash & OOM risk.
      # Heap must stay clearly below the container limit below.
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx768m"

      # --- Performance & Reliability ---
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # --- JMX for Prometheus monitoring ---
      JMX_PORT: 9999
      KAFKA_JMX_OPTS: >-
        -Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Dcom.sun.management.jmxremote.local.only=false -Dcom.sun.management.jmxremote.rmi.port=9999 -Djava.rmi.server.hostname=kafka

      TZ: ${TZ}
    volumes:
      - kafka_data:/opt/kafka/data/logs
    ports:
      - "9094:9094" # External access from host
      - "9999:9999" # JMX
    networks:
      - agri-net
    healthcheck:
      test: [ "CMD-SHELL", "KAFKA_JMX_OPTS='' JMX_PORT='' /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1" ]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g

  # Kafka Topic Initializer - Creates all required topics on startup
  kafka-init:
    image: apache/kafka:3.7.1
    container_name: agri-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - agri-net
    environment:
      KAFKA_TOPIC_SENSORS: ${KAFKA_TOPIC_SENSORS}
      KAFKA_TOPIC_WEATHER: ${KAFKA_TOPIC_WEATHER}
      KAFKA_TOPIC_ALERTS: ${KAFKA_TOPIC_ALERTS}
      KAFKA_TOPIC_COMMANDS: ${KAFKA_TOPIC_COMMANDS}
      TZ: ${TZ}
    entrypoint: [ "/bin/bash", "-c" ]
    command: >
      "
        set -e
        echo 'Waiting for Kafka to be ready...'
        for i in $$(seq 1 30); do
          if /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; then
            break
          fi
          echo \"kafka not ready (attempt $$i/30), retrying in 2s...\"
          sleep 2
        done

        echo 'Creating Kafka topics...'
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic $${KAFKA_TOPIC_SENSORS} --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic sensor-data --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic $${KAFKA_TOPIC_WEATHER} --partitions 2 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic $${KAFKA_TOPIC_ALERTS} --partitions 2 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic $${KAFKA_TOPIC_COMMANDS} --partitions 2 --replication-factor 1

        echo 'All topics created successfully!'
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
      "

  # Kafka UI - Web interface to monitor topics, consumers, messages
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: agri-kafka-ui
    hostname: kafka-ui
    <<: [ *restart-policy, *common-logging ]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: smart-agri-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: PLAINTEXT
      # UI settings
      DYNAMIC_CONFIG_ENABLED: "true"
      AUTH_TYPE: DISABLED
      TZ: ${TZ}
    ports:
      - "8080:8080"
    networks:
      - agri-net
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8080/api/clusters 2>&1 || exit 1" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m

  # ===========================================================
  # LAYER 3: DATA LAKE - MinIO (S3-Compatible Object Storage)
  # Lakehouse Zones: Bronze / Silver / Gold
  # ===========================================================
  minio:
    image: minio/minio:latest
    container_name: agri-minio
    hostname: minio
    <<: [ *restart-policy, *common-logging ]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_REGION_NAME: ${MINIO_REGION}
      # Enable Prometheus metrics
      MINIO_PROMETHEUS_AUTH_TYPE: public
      MINIO_PROMETHEUS_URL: http://prometheus:9090
      TZ: ${TZ}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000" # S3 API endpoint
      - "9001:9001" # MinIO Console (Web UI)
    networks:
      - agri-net
      - monitoring-net
    command: server /data --console-address ":9001" --address ":9000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 768m

  # MinIO Client - Automatically creates all required buckets
  minio-init:
    image: minio/mc:latest
    container_name: agri-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - agri-net
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        echo ">>> Configuring MinIO client..."
        mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}

        echo ">>> Creating Lakehouse buckets..."
        mc mb --ignore-existing myminio/agri-lakehouse

  # ===========================================================
  # LAYER 4: PROCESSING ENGINE - Apache Spark 3.5
  # Standalone cluster: Master + Worker + History Server
  # Uses jupyter/pyspark-notebook as base (contains Spark 3.5)
  # ===========================================================1

  # Spark Master - Coordinates job submissions and resource management
  spark-master:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: agri-spark-master
    hostname: spark-master
    <<: [ *restart-policy, *common-logging ]
    user: root
    environment:
      <<: *spark-common-env
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: ${SPARK_MASTER_PORT}
      SPARK_MASTER_WEBUI_PORT: ${SPARK_MASTER_WEBUI_PORT}
      SPARK_DAEMON_MEMORY: 512m
    volumes:
      - spark_master_data:/opt/spark/work-dir
      - spark_history_data:/tmp/spark-events
      - spark_jars_cache:/home/jovyan/.ivy2
      - ./infra/spark/conf/spark-defaults.conf:/usr/local/spark/conf/spark-defaults.conf:ro
      - ./infra/spark/conf/log4j2.properties:/usr/local/spark/conf/log4j2.properties:ro
      - ./infra/spark/jars:/opt/spark/extra-jars:ro
      - ./src/processing:/opt/spark/apps:rw
      - ./src/common:/opt/spark/apps/common:rw
      - ./scripts:/opt/spark/scripts:ro
    ports:
      - "8090:${SPARK_MASTER_WEBUI_PORT}" # Spark Master Web UI
      - "7077:${SPARK_MASTER_PORT}" # Spark Master port
    networks:
      - agri-net
    command: >
      bash -c "
        export SPARK_HOME=/usr/local/spark &&
        bash /opt/spark/scripts/auto_kill_streaming_jobs.sh &
        $$SPARK_HOME/sbin/start-master.sh --host spark-master --port ${SPARK_MASTER_PORT} --webui-port ${SPARK_MASTER_WEBUI_PORT} &&
        tail -f $$SPARK_HOME/logs/*.out
      "
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:${SPARK_MASTER_WEBUI_PORT} > /dev/null" ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        # Hosts up to FOUR concurrent streaming driver JVMs (768m heap each,
        # ~300MB real RSS each) + the 512m master daemon. Observed peak was
        # 1.27GB; a cgroup OOM occurred at 2g during 4-driver overlap.
        limits:
          memory: 2560m

  # Spark Worker - Executes tasks assigned by Spark Master
  spark-worker:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: agri-spark-worker
    hostname: spark-worker
    <<: [ *restart-policy, *common-logging ]
    user: root
    depends_on:
      spark-master:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *spark-common-env
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:${SPARK_MASTER_PORT}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY}
      SPARK_WORKER_WEBUI_PORT: ${SPARK_WORKER_WEBUI_PORT}
      SPARK_DAEMON_MEMORY: 512m
    volumes:
      - spark_worker_data:/opt/spark/work-dir
      - spark_history_data:/tmp/spark-events
      - spark_jars_cache:/home/jovyan/.ivy2
      - ./infra/spark/conf/spark-defaults.conf:/usr/local/spark/conf/spark-defaults.conf:ro
      - ./infra/spark/conf/log4j2.properties:/usr/local/spark/conf/log4j2.properties:ro
      - ./infra/spark/jars:/opt/spark/extra-jars:ro
      - ./src/processing:/opt/spark/apps:rw
      - ./src/common:/opt/spark/apps/common:rw
      - ./scripts:/opt/spark/scripts:ro
    ports:
      - "8091:${SPARK_WORKER_WEBUI_PORT}" # Spark Worker Web UI
    networks:
      - agri-net
    command: >
      bash -c "
        export SPARK_HOME=/usr/local/spark &&
        $$SPARK_HOME/sbin/start-worker.sh spark://spark-master:${SPARK_MASTER_PORT} --webui-port ${SPARK_WORKER_WEBUI_PORT} &&
        tail -f $$SPARK_HOME/logs/*.out
      "
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:${SPARK_WORKER_WEBUI_PORT} > /dev/null" ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2560m

  # Spark History Server - Browse completed & running application logs
  spark-history:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: agri-spark-history
    hostname: spark-history
    <<: [ *restart-policy, *common-logging ]
    user: root
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *spark-common-env
      SPARK_DAEMON_MEMORY: 256m
    volumes:
      - spark_history_data:/tmp/spark-events
      - spark_jars_cache:/home/jovyan/.ivy2
      - ./infra/spark/conf/spark-defaults.conf:/usr/local/spark/conf/spark-defaults.conf:ro
      - ./infra/spark/conf/log4j2.properties:/usr/local/spark/conf/log4j2.properties:ro
      - ./src/processing:/opt/spark/apps:rw
      - ./src/common:/opt/spark/apps/common:rw
      - ./scripts:/opt/spark/scripts:ro
    ports:
      - "18080:18080" # Spark History Server Web UI
    networks:
      - agri-net
    command: >
      bash -c "
        export SPARK_HOME=/usr/local/spark &&
        $$SPARK_HOME/sbin/start-history-server.sh &&
        tail -f $$SPARK_HOME/logs/*.out
      "
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:18080 > /dev/null" ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m

  # ===========================================================
  # LAYER 5: ANALYTICS ENGINE
  # ClickHouse - Columnar OLAP for Gold Layer / Power BI
  # ===========================================================
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: agri-clickhouse
    hostname: clickhouse
    <<: [ *restart-policy, *common-logging ]
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      TZ: ${TZ}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./infra/clickhouse/config/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
      - ./infra/clickhouse/config/users.xml:/etc/clickhouse-server/users.d/agri-users.xml:ro
      - ./sql/clickhouse/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "8123:8123" # HTTP interface (Power BI, REST)
      - "9002:9000" # Native TCP interface
      - "8001:8001" # Prometheus metrics endpoint
    networks:
      - agri-net
      - monitoring-net
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          memory: 2g

  # ===========================================================
  # LAYER 6: ORCHESTRATION - Apache Airflow 2.9.1
  # LocalExecutor - tasks run as subprocesses of the scheduler
  # (migrated from CeleryExecutor to save ~1.5GB RAM on this host)
  # ===========================================================

  # Airflow Init - Database migration + admin user creation
  airflow-init:
    image: apache/airflow:2.9.1
    container_name: agri-airflow-init
    depends_on:
      <<: *airflow-common-depends
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      _AIRFLOW_WWW_USER_FIRSTNAME: ${AIRFLOW_ADMIN_FIRSTNAME}
      _AIRFLOW_WWW_USER_LASTNAME: ${AIRFLOW_ADMIN_LASTNAME}
      _AIRFLOW_WWW_USER_EMAIL: ${AIRFLOW_ADMIN_EMAIL}
      _AIRFLOW_WWW_USER_ROLE: Admin
    volumes:
      - ./orchestration/airflow/dags:/opt/airflow/dags:rw
      - ./orchestration/airflow/plugins:/opt/airflow/plugins:rw
      - airflow_logs:/opt/airflow/logs
    networks:
      - agri-net
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create --username $${AIRFLOW_ADMIN_USER} --password $${AIRFLOW_ADMIN_PASSWORD} --firstname $${AIRFLOW_ADMIN_FIRSTNAME} --lastname $${AIRFLOW_ADMIN_LASTNAME} --email $${AIRFLOW_ADMIN_EMAIL} --role Admin || true
        echo 'Airflow init complete!'
      "

  # Airflow Webserver - Web UI for DAG management
  airflow-webserver:
    image: apache/airflow:2.9.1
    container_name: agri-airflow-webserver
    hostname: airflow-webserver
    <<: [ *restart-policy, *common-logging ]
    depends_on:
      <<: *airflow-common-depends
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-common-env
    volumes: *airflow-common-volumes
    ports:
      - "8085:8080" # Airflow Web UI
    networks:
      - agri-net
    command: webserver
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8080/health > /dev/null" ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 768m

  # Airflow Scheduler - Parses DAGs and triggers task instances
  airflow-scheduler:
    image: apache/airflow:2.9.1
    container_name: agri-airflow-scheduler
    hostname: airflow-scheduler
    <<: [ *restart-policy, *common-logging ]
    depends_on:
      <<: *airflow-common-depends
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-common-env
    volumes: *airflow-common-volumes
    networks:
      - agri-net
    command: scheduler
    healthcheck:
      test: [ "CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname airflow-scheduler" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1g

  # ===========================================================
  # Airflow Worker - REMOVED (CeleryExecutor → LocalExecutor).
  # Tasks now execute as subprocesses of the scheduler process.
  #
  # Airflow Triggerer - REMOVED.
  # No DAG in this project uses deferrable operators; re-add if
  # deferrable sensors/operators are introduced later.
  # ===========================================================

  # ===========================================================
  # LAYER 7: MONITORING - Prometheus + Grafana
  # ===========================================================

  # Prometheus - Time-series metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: agri-prometheus
    hostname: prometheus
    <<: [ *restart-policy, *common-logging ]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION}"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090" # Prometheus Web UI + API
    networks:
      - agri-net
      - monitoring-net
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m

  # Grafana - Visualization dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: agri-grafana
    hostname: grafana
    <<: [ *restart-policy, *common-logging ]
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource,grafana-piechart-panel
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GF_SERVER_DOMAIN: localhost
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/overview.json
      TZ: ${TZ}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000" # Grafana Web UI
    networks:
      - agri-net
      - monitoring-net
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
