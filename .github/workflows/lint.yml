name: Lint

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: pip install flake8

      - name: Run flake8 on src/
        run: |
          flake8 src/ \
            --max-line-length=120 \
            --extend-ignore=E501,W503 \
            --exclude=src/ml/models,src/ml/datasets

      - name: Run flake8 on orchestration/
        run: |
          flake8 orchestration/ \
            --max-line-length=120 \
            --extend-ignore=E501,W503
