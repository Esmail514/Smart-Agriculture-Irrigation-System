name: Test

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development requirements
        run: |
          pip install --upgrade pip
          # requirements-dev.txt includes requirements.txt (pyspark, pandas,
          # scikit-learn, pytest, docker, ...) — the full test toolchain.
          pip install -r requirements-dev.txt

      - name: Syntax check — all Python files in src/
        run: |
          find src/ -name "*.py" | while read f; do
            python -m py_compile "$f" && echo "OK: $f" || exit 1
          done

      - name: Syntax check — orchestration DAGs
        run: |
          find orchestration/ -name "*.py" | while read f; do
            python -m py_compile "$f" && echo "OK: $f" || exit 1
          done

      - name: Syntax check — scripts and tests
        run: |
          find scripts/ tests/ -name "*.py" | while read f; do
            python -m py_compile "$f" && echo "OK: $f" || exit 1
          done

      - name: Run unit + smoke tests (pytest)
        run: pytest tests/ -v

